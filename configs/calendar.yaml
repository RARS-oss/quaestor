      - {time: "10:30", tag: ALL_CASH, desc: "Flatten everything — realize P&L before 11:00 EDT deadline", status: confirmed}
regime:
  vix_range: [14, 16]          # 2026 lows — long premium historically cheap
  bias: "long-premium barbell: defined-risk debit core + catalyst convexity shots"
