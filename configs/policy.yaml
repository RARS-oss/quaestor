# quaestor risk policy v1 — this file is hashed (sha256) into every RiskVerdict and bulla receipt.
# Changing it changes policy_digest -> visible in the audit trail. Never bypass in code.
version: 1
# AGGRESSIVE CONVEX BARBELL: push upside hard, but the aggregate premium-at-risk
# budget + defined-risk-only + daily/weekly halts make blowing up impossible by
# construction — the worst case is bounded to the deployed premium.
account:
  daily_loss_halt_pct: 18          # stop opening new positions for the day at -18% vs day open
  weekly_loss_halt_pct: 30         # hard stop for the rest of the contest (the floor)
  max_open_risk_pct: 55            # "cannot blow up" gate: total open premium-at-risk <= 55% equity
  max_concurrent_positions: 5      # more shots on goal (was 3)
  max_underlying_concentration_pct:
    default: 45
    SPY: 70
    QQQ: 70
per_trade:
  max_loss_pct_default: 12         # of current equity, worst-case defined risk
  max_loss_pct_catalyst: 22        # catalyst/conviction shots (the convex bets)
  min_open_interest: 100
  max_spread_quality: 0.03         # (ask - bid) / mid must be <= 3% on every leg
  min_leg_price: 0.05              # avoid sub-nickel junk contracts
structures:
  allowed: [long_call, long_put, vertical_debit, vertical_credit, straddle, close]
  defined_risk_only: true          # every short leg must be covered within the same order (mleg rule)
timing:
  no_new_0dte_after_et: "15:10"
  flat_0dte_by_et: "15:25"
  no_new_positions_after_et: "15:45"
  final_day: "2026-09-04"
  final_day_all_cash_by_et: "10:30"   # realize all P&L before the 11:00 EDT submission deadline
execution:
  time_in_force: day
  marketable_buffer_usd: 0.02      # single-leg: buy at ask+buffer, sell at bid-buffer
  mleg_buffer_usd: 0.05            # net-price buffer over sum of touches
  repost_after_s: 8                # cancel-and-repost loop for unfilled marketable limits
  max_reposts: 5
  order_poll_interval_s: 1.5
loop:
  max_consecutive_errors: 8        # unattended breaker: stop after this many failing cycles in a row
  # A file named HALT in runs/ is a manual kill switch; heartbeat.json shows liveness.
