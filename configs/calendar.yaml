    events:
      - {time: "09:30", tag: MONTH_END, desc: "Month-end flows day", status: confirmed}
  - date: 2026-09-01
    events:
      - {time: "10:00", tag: ISM_MFG, desc: "ISM Manufacturing PMI", status: inferred}
      - {time: "10:00", tag: JOLTS, desc: "JOLTS job openings (BLS confirmed)", status: confirmed}
  - date: 2026-09-02
    events:
